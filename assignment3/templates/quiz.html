<!DOCTYPE html>
<html>
<head>
    <title>Quiz Question</title>
</head>
<body>

<h2>
    Question {{ question_number }} of {{ total }}
</h2>

<h3>{{ question.question }}</h3>

<form action="/submit" method="POST">

    {% for choice in question.choices %}

        <input
            type="radio"
            name="answer"
            value="{{ choice }}"
            required>

        {{ choice }}

        <br>

    {% endfor %}

    <button type="submit">
        Submit Answer
    </button>

</form>

</body>
</html>
